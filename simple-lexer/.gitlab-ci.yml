stages:
  - build_test_report

build_all:
  stage: build_test_report
  before_script:
    - nuget restore
    - msbuild Lexer.sln
  script:  
    - .\TestRunner\bin\Debug\net8.0\TestRunner.exe
  after_script:
    - .\NunitReport\bin\Debug\net8.0\Report.exe ${CI_PROJECT_DIR} ${GITLAB_USER_LOGIN}
  tags:
    - windows
    - dotnet
